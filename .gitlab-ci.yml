stages:
  - build
  - test

build:ubuntu:noble:
  image: ubuntu:24.04
  stage: build
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    - apt-get update
    - apt-get upgrade -y
    - ln -fs /usr/share/zoneinfo/Asia/Kolkata /etc/localtime
    - apt-get install -y tzdata
    - dpkg-reconfigure --frontend noninteractive tzdata
    - apt-get install -y build-essential checkinstall zlib1g-dev
    - apt-get install -y libboost-all-dev cmake gcc clang git curl libcurl4-gnutls-dev wget libssl-dev libpugixml-dev nlohmann-json3-dev libpq-dev postgresql-server-dev-all catch2 doxygen liblua5.3-dev tao-pegtl-dev libmagic-dev libhiredis-dev
  script:
    - cd vendor
    - git submodule init
    - git submodule update --init --recursive --force
    - cd ..
    - mkdir build
    - cd build
    - cmake -DPostgreSQL_TYPE_INCLUDE_DIR=/usr/include/postgresql/ ..
    - make
  artifacts:
    paths:
      - build
    
test:ubuntu:noble:
  image: ubuntu:24.04
  stage: test
  variables:
    DEBIAN_FRONTEND: "noninteractive"
    LANG: en_US.utf8
    LC_ALL: "en_US.UTF-8"
  before_script:
    - echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections
    - apt-get update
    - apt-get install -y locales
    - locale-gen en_US.UTF-8  # Ensure the locale is generated
    - update-locale LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8
    - apt-get upgrade -y
    - ln -fs /usr/share/zoneinfo/Asia/Kolkata /etc/localtime
    - apt-get install -y tzdata
    - dpkg-reconfigure --frontend noninteractive tzdata
    - apt-get install -y build-essential checkinstall zlib1g-dev libboost-all-dev cmake gcc clang git curl wget libssl-dev libpugixml-dev nlohmann-json3-dev catch2 doxygen liblua5.3-dev
    - apt-get install -y postgresql postgresql-client libpq-dev postgresql-contrib postgresql-server-dev-all libhiredis-dev redis-server
    - PSQL_VER=$(psql --version | awk '{print $3}' | cut -d '.' -f1)
    - PSQL_CONF_DIR="/etc/postgresql/$PSQL_VER/main"
    - sed -E "s/local\s+all(.+)peer/local all\1 trust/g" $PSQL_CONF_DIR/pg_hba.conf > /tmp/pg_hba.conf
    - cp /tmp/pg_hba.conf $PSQL_CONF_DIR/pg_hba.conf
    - service postgresql start
    - service postgresql status
    - nohup redis-server --daemonize yes
    - redis-cli ping
    - df -h
    - df -h /tmp || true
    - df -h /dev/shm || true
    - ls -l /dev/mqueue 2>/dev/null | wc -l || true
    - cat /proc/sys/fs/mqueue/msg_max 2>/dev/null || true
    - cat /proc/sys/fs/mqueue/msgsize_max 2>/dev/null || true
    - cat /proc/sys/fs/mqueue/queues_max 2>/dev/null || true
    - find /dev/mqueue -maxdepth 1 -type f -name 'udho*' -delete 2>/dev/null || true
    - rm -f /tmp/udho*.sock 2>/dev/null || true
  # script:
  #   - cd build
  #   - ctest --output-on-failure
  #   - tar -czvf results.tar.gz results
  # artifacts:
  #   paths:
  #     - build/results.tar.gz
  # dependencies:
  #   - build:ubuntu:noble
  script:
    - cd build
    - ctest -j1 --repeat until-pass:3 --output-on-failure --timeout 240 || ctest_exit=$?
    - exit ${ctest_exit:-0}
  artifacts:
    paths:
      - build/results/
    reports:
      junit: build/results/**/*.xml
  dependencies:
    - build:ubuntu:noble
    
